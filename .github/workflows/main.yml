name: Build CarPlay Web Browser IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build iOS App & Package IPA
        run: |
          mkdir -p build
          xcodebuild -project CarPlayWebBrowser.xcodeproj -scheme CarPlayWebBrowser -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO BUILD_DIR=build
          mkdir -p Payload
          cp -r build/Release-iphoneos/CarPlayWebBrowser.app Payload/
          zip -r CarPlayWebBrowser.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayWebBrowser-IPA
          path: CarPlayWebBrowser.ipa
